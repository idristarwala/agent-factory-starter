name: Verify pinned release images
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports: [5000/tcp]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Build against the disposable registry
        env:
          IMAGE_REPOSITORY: localhost:${{ job.services.registry.ports[5000] }}/factory
        run: GITHUB_REF_NAME=v0.0.0-check ./scripts/build-release.sh
      - name: Verify artifacts and run all roles by digest
        run: |
          cd .factory/release
          jq -e --arg engine "$(cat ../../engine.commit)" --arg starter "$GITHUB_SHA" '
            .source.commit == $engine and .build.commit == $starter and
            .image == .images.engine and (.images | keys == ["connector","engine","worker"])
          ' release-manifest.json
          jq -er '.binaries[]' release-manifest.json | while read -r binary; do test -s "$binary"; done
          for role in engine worker connector; do
            image=$(jq -er --arg role "$role" '.images[$role]' release-manifest.json)
            docker run --rm --entrypoint cat "$image" /usr/share/licenses/agent-factory/LICENSE | cmp - LICENSE
            case "$role" in
              engine)
                docker run --rm -e FACTORY_STORE_MODE=memory --entrypoint factory "$image" readiness
                api=$(docker run -d -p 127.0.0.1::8080 --entrypoint api -e FACTORY_STORE_MODE=memory -e API_TOKEN=ci-workspace -e LLM_GATEWAY_CONFIG=/config/gateway.yaml -v "$PWD/../../gateway.yaml:/config/gateway.yaml:ro" "$image")
                trap 'docker rm -f "$api" >/dev/null' EXIT
                url="http://$(docker port "$api" 8080/tcp)"
                curl --retry 10 --retry-connrefused --retry-delay 1 -fsS "$url/health" | jq -e '.store == "memory"'
                test "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/settings")" = 401
                google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "$url/" > /tmp/engine-dom.html
                grep -Fq 'Connect to Agent Factory' /tmp/engine-dom.html ;;
              worker) docker run --rm "$image" -help 2>&1 | grep -- '-records' ;;
              connector)
                mkdir -p sample/vendor
                cat >sample/vendor/tools.yaml <<YAML
          tools: {lookup: {url: "https://raw.githubusercontent.com/idristarwala/agent-factory/$(cat ../../engine.commit)/schemas/pack.schema.json"}}
          YAML
                digest=$(sha256sum sample/vendor/tools.yaml | cut -d' ' -f1)
                cat >sample/factory.yaml <<YAML
          tool_packages: [{path: vendor/tools.yaml, sha256: "$digest"}]
          evidence:
            grants: [{pack: review, tools: [lookup], side_effects: [read-only]}]
          YAML
                sample() {
                  docker run --rm -v "$PWD/sample:/workspace:ro" -e FACTORY_SOURCE_CONFIG=/workspace/factory.yaml -e "FACTORY_PACK=$1" "$image" lookup "${@:2}"
                }
                if sample unknown 2>error.log; then exit 1; fi
                grep -F 'source unavailable for this factory' error.log
                if sample review undeclared=one 2>error.log; then exit 1; fi
                grep -F 'unsupported source query parameter' error.log
                sample review | jq -e '.type == "object" and (.required | index("worker_roles") != null)'
                echo >>sample/vendor/tools.yaml
                if sample review 2>error.log; then exit 1; fi
                grep -F 'SHA-256 mismatch' error.log ;;
            esac
          done
